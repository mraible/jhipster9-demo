version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'weekly'
