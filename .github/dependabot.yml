version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      maven-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
